name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bpmn
          POSTGRES_PASSWORD: bpmn
          POSTGRES_DB: bpmn
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      PYTHONIOENCODING: utf-8
      # Целевая СУБД проверяется уже на конвейере: SQLite остаётся легаси-режимом.
      # Тестовая база отдельная — прогон не должен зависеть от состояния base `bpmn`.
      TEST_DATABASE_URL: postgresql+psycopg2://bpmn:bpmn@localhost:5432/bpmn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Создать тестовую базу
        run: psql -h localhost -U bpmn -d postgres -c 'CREATE DATABASE bpmn_test OWNER bpmn'
        env:
          PGPASSWORD: bpmn
      # Тот же путь, что у администратора с CLI: проверено, что ini и env.py
      # работают без питоновских фикстур.
      - name: Применить миграции к тестовой базе
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          # env.py импортирует app.db -> app.config, который требует SECRET_KEY
          # на PostgreSQL. Значение фиктивное: JWT в этом шаге не подписывают.
          SECRET_KEY: ci-only-secret
      # Дальше схема уже на месте, её только подтверждает фикстура conftest.py.
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bpmn-constructor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bpmn-constructor/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: 'false'
