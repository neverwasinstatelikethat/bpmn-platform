name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bpmn
          POSTGRES_PASSWORD: bpmn
          POSTGRES_DB: bpmn
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      # Целевая СУБД проверяется уже на конвейере: SQLite остаётся легаси-режимом.
      DATABASE_URL: postgresql+psycopg2://bpmn:bpmn@localhost:5432/bpmn
      SECRET_KEY: ci-only-secret
      SKIP_LLM_INIT: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bpmn-constructor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bpmn-constructor/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: 'false'
